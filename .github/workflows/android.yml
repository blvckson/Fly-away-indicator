name: Android Build

# A push to the feature branch runs unit tests and packages a fresh debug APK.

on:
  push:
    branches: [ main, fix/long-round-pre-fly-timing-20261122 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fly-away-indicator-debug
          path: app/build/outputs/apk/debug/app-debug.apk
