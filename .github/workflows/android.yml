name: Android Build

# Feature-branch pushes run unit tests, package an APK, and exercise the app on
# an Android 8.1 emulator. The emulator smoke test covers the UI and the actual
# MediaProjection-consent -> foreground-service -> ImageReader startup path.

on:
  push:
    branches: [ main, fix/long-round-pre-fly-timing-20261122 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build debug APK and run unit tests
        shell: bash
        run: |
          # Maven Central occasionally rate-limits GitHub-hosted runners (HTTP 429).
          # Retry the complete, idempotent Gradle task with increasing delays so
          # transient repository throttling does not produce a false build failure.
          for attempt in 1 2 3 4; do
            if gradle testDebugUnitTest assembleDebug --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 20))
            fi
          done
          exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fly-away-indicator-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator-runtime:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android 8.1 runtime smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Install both APKs first; appops cannot target a package before Android
            # has registered its UID on the emulator.
            gradle installDebug installDebugAndroidTest --no-daemon
            adb shell pm path com.blvckson.flyawayindicator
            adb shell pm path com.blvckson.flyawayindicator.test
            adb shell appops set com.blvckson.flyawayindicator SYSTEM_ALERT_WINDOW allow
            adb shell appops get com.blvckson.flyawayindicator SYSTEM_ALERT_WINDOW
            # Reuse the installed APKs so the appops grant is not disturbed by a
            # second install step while connected instrumentation tests start.
            # Retry transient Maven Central 429s; connected tests are idempotent because
            # the run starts from a freshly installed app and the test cleans up its service.
            run_gradle_with_retry() {
              local attempt=1
              while [ "$attempt" -le 4 ]; do
                if gradle "$@" --no-daemon; then
                  return 0
                fi
                if [ "$attempt" -lt 4 ]; then
                  sleep $((attempt * 20))
                fi
                attempt=$((attempt + 1))
              done
              return 1
            }
            set +e
            run_gradle_with_retry connectedDebugAndroidTest -x installDebug -x installDebugAndroidTest
            test_result=$?
            mkdir -p app/build/reports/androidTests/connected
            adb pull /sdcard/aviator-replay-failure.png app/build/reports/androidTests/connected/aviator-replay-failure.png || true
            exit $test_result
      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-runtime-test-reports
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
