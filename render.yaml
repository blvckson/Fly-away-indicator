services:
  - type: web
    name: fly-away-authorization-server
    runtime: node
    rootDir: authorization-server
    buildCommand: echo "No external dependencies"
    startCommand: node server.js
    healthCheckPath: /health
    disk:
      name: authorization-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/data.json
      - key: ADMIN_API_KEY
        sync: false
