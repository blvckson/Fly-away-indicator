services:
  - type: web
    name: fly-away-authorization
    runtime: node
    plan: starter
    rootDir: authorization-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: authorization-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/data.json
      - key: ADMIN_API_KEY
        sync: false
